<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Basics</title>
  </head>
  <body>
    <body>
      <!-- div tag  -->
      hi there
      <div>
        hi there
        <div>hello</div>
        <div>hello 2</div>
      </div>
      <!-- span tag  -->
      <span>hello 1</span><span>hello 2</span>

      <!-- heading tag  -->
      <h1>hello</h1>
      <h2>hi there</h2>
      <h3>hi there</h3>
      <h4>hi there</h4>
      <h5>hi there</h5>
      <h6>hi there</h6>

      <!-- p tag  -->
      <p>it is a text content</p>

      <!-- img tag  -->
      <center>
        <img src="./nature.png" alt="nature image" width="500" />
      </center>

      <!-- a tag  -->
      <a href="https://www.google.com" target="_blank">Go to google</a>

      <!-- b and i tag  -->
      <b>hi there</b>
      <i>hi there</i>

      <!-- button element  -->
      <button>Click Here</button>

      <!-- input tag  -->
      <div><input type="text" placeholder="enter your username" /></div>
    </body>
  </body>
</html>
