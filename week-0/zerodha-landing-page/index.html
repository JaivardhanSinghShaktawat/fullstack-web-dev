<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Zerodha Landing Page</title>
    <link rel="stylesheet" href="./styles/style.css" type="text/css" />
  </head>
  <body>
    <!-- header and navigation menu section  -->
    <header class="header">
      <!-- logo image section -->
      <div class="logo">
        <img
          src="./assets/logo.svg"
          alt="logo"
          title="zerodha logo"
          width="150"
          height="auto"
        />
      </div>
      <nav class="navbar">
        <ul>
          <li class="hidden">
            <a href="#" target="_blank">Signup</a>
          </li>
          <li class="hidden">
            <a href="#" target="_blank">About</a>
          </li>
          <li class="hidden">
            <a href="#" target="_blank">Products</a>
          </li>
          <li class="hidden">
            <a href="#" target="_blank">Pricing</a>
          </li>
          <li class="hidden">
            <a href="#" target="_blank">Support</a>
          </li>
          <li class="hamburger-icon">
            <a href="#" target="_blank">
              <div></div>
              <div></div>
              <div></div>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- hero section  -->
    <main class="hero-section">
      <!-- hero image  -->
      <div class="landing-logo">
        <img
          src="./assets/landing.svg"
          alt="landing image"
          loading="lazy"
          width="100%"
          height="auto"
        />
      </div>

      <!-- hero section : information section  -->
      <div class="hero-section__information">
        <div class="hero-section__information-heading">
          <h3>Invest in everything</h3>
        </div>
        <div class="hero-section__information-para">
          <p>
            Online platform to invest in stocks, IPOs, derivatives, mutual
            funds, ETFs, bonds, and more.
          </p>
        </div>
        <!-- hero section : signup button  -->
        <div class="hero-section__information-signup-btn">
          <button>Sign up for free</button>
        </div>
      </div>
    </main>
  </body>
</html>
