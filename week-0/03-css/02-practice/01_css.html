<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Basics</title>
    <!-- Importing external CSS  -->
    <link rel="stylesheet" href="./style.css" type="text/css" />

    <!-- Internal Stylesheet -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <p>hi there</p>

    <!-- Basics CSS properties  -->
    <h1
      style="
        font-size: 32px;
        color: red;
        background-color: aqua;
        border-radius: 10px;
        border: 2px solid orange;
        padding: 10px 2px;
        margin: 50px;
        box-shadow: 2px 10px 10px black;
      "
    >
      hi there
    </h1>

    <!-- float property  -->
    <div style="margin-left: 100px; margin-right: 100px">
      <img src="./assets/logo.svg" alt="logo" width="150" height="20" />
      <span style="float: right">Sign Up</span>
    </div>

    <!-- positioning html elements using flexbox.  -->
    <div
      style="
        display: flex;
        justify-content: space-between;
        padding-left: 100px;
        padding-right: 100px;
        align-items: center;
      "
    >
      <img src="./assets/logo.svg" alt="logo" width="150" height="20" />
      <div style="display: flex; align-items: center; padding: 20px">
        <div>Signup</div>
        <div>About us</div>
        <div>Services</div>
        <div>Contact</div>
      </div>
    </div>
  </body>
</html>
